services:
  php:
    build: .
    ports:
      - "8000:8000"
    command: sleep infinity
    volumes:
      - ../:/workspace:cached
    depends_on:
      - db
  db:
    image: mariadb:11.3
    environment:
      MARIADB_ROOT_PASSWORD: osclass
      MARIADB_DATABASE: osclass
      MARIADB_USER: osclass
      MARIADB_PASSWORD: osclass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: osclass
    ports:
      - "8081:80"
    depends_on:
      - db

volumes:
  db_data:
